AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "Postgres URL for database 'renown' on the VPS (103.86.176.17:6432). Passed from renown-api/.env via --parameter-overrides. Never commit the password here. A direct Lambda env edit is overwritten on the next sam deploy unless this parameter matches .env."
  JwtSecret:
    Type: String
    NoEcho: true
    Description: "Secret used to sign customer/staff/admin JWTs — passed via --parameter-overrides, never committed here."
  JwtExpireMinutes:
    Type: String
    Default: "720"
  EnvironmentName:
    Type: String
    Default: "production"
    AllowedValues:
      - production
      - development
    Description: "Gates dev-only behavior (e.g. the demo OTP bypass) — must stay 'production' for real deployments."
  RazorpayKeyId:
    Type: String
    Default: "rzp_live_TYZikwbbGsP7pE"
    Description: "Razorpay key id (live)."
  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: "dmWAny26145LqUR6KXKDhpOJ"
    Description: "Razorpay key secret (live)."
  CorsOriginRegex:
    Type: String
    Default: "^https?://localhost(:\\d+)?$|^https://([a-z0-9-]+\\.)?renowneyewear\\.com$"
    Description: "Regex of allowed CORS origins (admin/staff/customer portals + any subdomain of renowneyewear.com). Override via --parameter-overrides for a different domain."
  ShiprocketEmail:
    Type: String
    Default: "renownapi@gmail.com"
    Description: "Shiprocket API user email (Settings → API)."
  ShiprocketPassword:
    Type: String
    NoEcho: true
    Default: "bT*LOZ@i&hzssy&1Ii^v2SE7kLSk#sa$"
    Description: "Shiprocket API user password — pass via --parameter-overrides, never commit."
  ShiprocketWebhookToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Shared secret for POST /courier/tracking-update. Paste the same value into Shiprocket Settings → API → Webhooks; empty disables the endpoint."
  WhatsappAccessToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Meta WhatsApp Cloud API access token for OTP — pass via --parameter-overrides, never commit."
  WhatsappPhoneNumberId:
    Type: String
    Default: "1328705783660234"
    Description: "Meta WhatsApp phone number id of the Renown sender (+91 96425 12952)."
  WhatsappOtpTemplate:
    Type: String
    Default: "verify_v1"
    Description: "Meta WhatsApp Authentication template name."
  WhatsappOtpLang:
    Type: String
    Default: "en_US"
    Description: "Meta WhatsApp template language code."
  PublicImageBucket:
    Type: String
    Default: "renown-public"
    Description: "Public S3 bucket for catalog product images and homepage banners."
  PublicImageRegion:
    Type: String
    Default: "ap-south-2"
    Description: "Region of the public image bucket."

Globals:
  Function:
    Timeout: 900
    MemorySize: 1024
    Tags:
      project: "renown-api"
      environment: "production"
  Api:
    BinaryMediaTypes:
      - "image~1*"
      - "multipart~1form-data"

Resources:
  RenownHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Tags:
        project: renown-api
        environment: production

  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: app.main.handler
      CodeUri: .
      AutoPublishAlias: live
      SnapStart:
        ApplyOn: PublishedVersions
      Environment:
        Variables:
          # Sourced from the DatabaseUrl parameter (.env), not hardcoded.
          # Production: postgresql://admin@103.86.176.17:6432/renown
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRE_MINUTES: !Ref JwtExpireMinutes
          ENVIRONMENT: !Ref EnvironmentName
          TZ: Asia/Kolkata
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
          CORS_ORIGIN_REGEX: !Ref CorsOriginRegex
          SHIPROCKET_EMAIL: !Ref ShiprocketEmail
          SHIPROCKET_PASSWORD: !Ref ShiprocketPassword
          SHIPROCKET_WEBHOOK_TOKEN: !Ref ShiprocketWebhookToken
          SHIPROCKET_PICKUP_LOCATION: Store
          WHATSAPP_ACCESS_TOKEN: !Ref WhatsappAccessToken
          WHATSAPP_PHONE_NUMBER_ID: !Ref WhatsappPhoneNumberId
          WHATSAPP_OTP_TEMPLATE: !Ref WhatsappOtpTemplate
          WHATSAPP_OTP_LANG: !Ref WhatsappOtpLang
          S3_PUBLIC_BUCKET: !Ref PublicImageBucket
          S3_PUBLIC_REGION: !Ref PublicImageRegion
          S3_PUBLIC_BASE_URL: !Sub "https://${PublicImageBucket}.s3.${PublicImageRegion}.amazonaws.com"
          ORDER_NOTIFY_QUEUE_URL: "https://sqs.ap-south-2.amazonaws.com/021859651726/optimus-order-notify"
          # Gitignored key file shipped in the package (too large for the 4 KB env limit).
          FIREBASE_SERVICE_ACCOUNT_FILE: firebase-service-account.json
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::renown-api/*"
                - !Sub "arn:aws:s3:::${PublicImageBucket}/catalog/*"
                - !Sub "arn:aws:s3:::${PublicImageBucket}/homepage/*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: arn:aws:sqs:ap-south-2:021859651726:optimus-order-notify
      Events:
        AnalyticsTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /analytics/track
            Method: POST
            TimeoutInMillis: 10000
            PayloadFormatVersion: "2.0"
            RouteSettings:
              ThrottlingBurstLimit: 30
              ThrottlingRateLimit: 10
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /
            Method: ANY
            TimeoutInMillis: 29000
            PayloadFormatVersion: "2.0"
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /{proxy+}
            Method: ANY
            TimeoutInMillis: 29000
            PayloadFormatVersion: "2.0"

  FastApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FastApiFunction}"
      RetentionInDays: 7

  HomeCacheResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-home-public-cors"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - "*"
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - "*"
          AccessControlExposeHeaders:
            Items:
              - Cache-Control
              - ETag
          AccessControlMaxAgeSec: 86400
          OriginOverride: true

  HomeApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: "Cached public Renown homepage API"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: RenownHttpApiOrigin
            DomainName: !Sub "${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: RenownHttpApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref HomeCacheResponseHeadersPolicy

Outputs:
  ApiId:
    Description: "HTTP API Gateway ID"
    Value: !Ref RenownHttpApi
  FastApiApi:
    Description: "Renown API Gateway URL (dual-stack IPv4/IPv6)"
    Value: !Sub "https://${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  HealthCheckUrl:
    Description: "Health check endpoint"
    Value: !Sub "https://${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
  HomeCacheUrl:
    Description: "CloudFront-cached public homepage API origin"
    Value: !Sub "https://${HomeApiDistribution.DomainName}"
