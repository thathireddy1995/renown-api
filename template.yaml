AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "Postgres URL for database 'renown' on the VPS (103.86.176.17:6432). Passed from renown-api/.env via --parameter-overrides. Never commit the password here. A direct Lambda env edit is overwritten on the next sam deploy unless this parameter matches .env."
  JwtSecret:
    Type: String
    NoEcho: true
    Description: "Secret used to sign customer/staff/admin JWTs — passed via --parameter-overrides, never committed here."
  JwtExpireMinutes:
    Type: String
    Default: "720"
  EnvironmentName:
    Type: String
    Default: "production"
    AllowedValues:
      - production
      - development
    Description: "Gates dev-only behavior (e.g. the demo OTP bypass) — must stay 'production' for real deployments."
  RazorpayKeyId:
    Type: String
    Default: "rzp_test_TFQQhSY0gwUMhs"
    Description: "Razorpay key id — test-mode default; pass a live key via --parameter-overrides for production."
  RazorpayKeySecret:
    Type: String
    NoEcho: true
    Default: "EGGkPibPOmeLQN6fRTUpK7Qi"
    Description: "Razorpay key secret — test-mode default; pass a live secret via --parameter-overrides for production."
  CorsOriginRegex:
    Type: String
    Default: "^https?://localhost(:\\d+)?$|^https://([a-z0-9-]+\\.)?renowneyewear\\.com$"
    Description: "Regex of allowed CORS origins (admin/staff/customer portals + any subdomain of renowneyewear.com). Override via --parameter-overrides for a different domain."
  ShiprocketEmail:
    Type: String
    Default: "renownapi@gmail.com"
    Description: "Shiprocket API user email (Settings → API)."
  ShiprocketPassword:
    Type: String
    NoEcho: true
    Default: "bT*LOZ@i&hzssy&1Ii^v2SE7kLSk#sa$"
    Description: "Shiprocket API user password — pass via --parameter-overrides, never commit."
  Msg91AuthKey:
    Type: String
    NoEcho: true
    Default: "554114Avcg6BwNFF6a65c35aP1"
    Description: "MSG91 auth key for WhatsApp OTP — move to secrets later."
  Msg91WaNumber:
    Type: String
    Default: "919642512952"
    Description: "MSG91 WhatsApp integrated sender number (country code, no +)."
  Msg91WaTemplate:
    Type: String
    Default: "verify_user_v1"
    Description: "MSG91 WhatsApp Authentication template name."
  Msg91WaLang:
    Type: String
    Default: "en_US"
    Description: "MSG91 WhatsApp template language code."
  PublicImageBucket:
    Type: String
    Default: "renown-public"
    Description: "Public S3 bucket for catalog product images and homepage banners."
  PublicImageRegion:
    Type: String
    Default: "ap-south-2"
    Description: "Region of the public image bucket."

Globals:
  Function:
    Timeout: 900
    MemorySize: 1792
    Tags:
      project: "renown-api"
      environment: "production"
  Api:
    BinaryMediaTypes:
      - "image~1*"
      - "multipart~1form-data"

Resources:
  RenownHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      Tags:
        project: renown-api
        environment: production

  FastApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Architectures:
        - x86_64
      Handler: app.main.handler
      CodeUri: .
      Environment:
        Variables:
          # Sourced from the DatabaseUrl parameter (.env), not hardcoded.
          # Production: postgresql://admin@103.86.176.17:6432/renown
          DATABASE_URL: !Ref DatabaseUrl
          JWT_SECRET: !Ref JwtSecret
          JWT_EXPIRE_MINUTES: !Ref JwtExpireMinutes
          ENVIRONMENT: !Ref EnvironmentName
          TZ: Asia/Kolkata
          RAZORPAY_KEY_ID: !Ref RazorpayKeyId
          RAZORPAY_KEY_SECRET: !Ref RazorpayKeySecret
          CORS_ORIGIN_REGEX: !Ref CorsOriginRegex
          SHIPROCKET_EMAIL: !Ref ShiprocketEmail
          SHIPROCKET_PASSWORD: !Ref ShiprocketPassword
          SHIPROCKET_PICKUP_LOCATION: Primary
          MSG91_AUTH_KEY: !Ref Msg91AuthKey
          MSG91_WA_NUMBER: !Ref Msg91WaNumber
          MSG91_WA_TEMPLATE: !Ref Msg91WaTemplate
          MSG91_WA_LANG: !Ref Msg91WaLang
          S3_PUBLIC_BUCKET: !Ref PublicImageBucket
          S3_PUBLIC_REGION: !Ref PublicImageRegion
          S3_PUBLIC_BASE_URL: !Sub "https://${PublicImageBucket}.s3.${PublicImageRegion}.amazonaws.com"
          ORDER_NOTIFY_QUEUE_URL: "https://sqs.ap-south-2.amazonaws.com/021859651726/optimus-order-notify"
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
                - s3:DeleteObject
              Resource:
                - !Sub "arn:aws:s3:::renown-api/*"
                - !Sub "arn:aws:s3:::${PublicImageBucket}/catalog/*"
                - !Sub "arn:aws:s3:::${PublicImageBucket}/homepage/*"
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: arn:aws:sqs:ap-south-2:021859651726:optimus-order-notify
      Events:
        AnalyticsTrack:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /analytics/track
            Method: POST
            TimeoutInMillis: 10000
            PayloadFormatVersion: "2.0"
            RouteSettings:
              ThrottlingBurstLimit: 30
              ThrottlingRateLimit: 10
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /
            Method: ANY
            TimeoutInMillis: 29000
            PayloadFormatVersion: "2.0"
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref RenownHttpApi
            Path: /{proxy+}
            Method: ANY
            TimeoutInMillis: 29000
            PayloadFormatVersion: "2.0"

  FastApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FastApiFunction}"
      RetentionInDays: 7

  HomeCacheResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-home-public-cors"
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders:
            Items:
              - "*"
          AccessControlAllowMethods:
            Items:
              - GET
              - HEAD
              - OPTIONS
          AccessControlAllowOrigins:
            Items:
              - "*"
          AccessControlExposeHeaders:
            Items:
              - Cache-Control
              - ETag
          AccessControlMaxAgeSec: 86400
          OriginOverride: true

  HomeApiDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: "Cached public Renown homepage API"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: RenownHttpApiOrigin
            DomainName: !Sub "${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: RenownHttpApiOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          ResponseHeadersPolicyId: !Ref HomeCacheResponseHeadersPolicy

Outputs:
  ApiId:
    Description: "HTTP API Gateway ID"
    Value: !Ref RenownHttpApi
  FastApiApi:
    Description: "Renown API Gateway URL (dual-stack IPv4/IPv6)"
    Value: !Sub "https://${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
  HealthCheckUrl:
    Description: "Health check endpoint"
    Value: !Sub "https://${RenownHttpApi}.execute-api.${AWS::Region}.amazonaws.com/health"
  HomeCacheUrl:
    Description: "CloudFront-cached public homepage API origin"
    Value: !Sub "https://${HomeApiDistribution.DomainName}"
